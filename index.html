<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>520快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  .page {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* ========== Page 1 ========== */
  #page1 {
    background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 50%, #ff1493 100%);
    z-index: 2;
  }

  #page1.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
  }

  .blink-text {
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 30px rgba(255,20,147,0.6);
    animation: blink 1.2s ease-in-out infinite;
    text-align: center;
    padding: 0 20px;
    line-height: 1.6;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }

  .btn-claim {
    margin-top: 60px;
    padding: 18px 60px;
    font-size: 1.3rem;
    font-weight: 700;
    color: #ff1493;
    background: #fff;
    border: none;
    border-radius: 50px;
    box-shadow: 0 8px 30px rgba(255,20,147,0.4);
    cursor: pointer;
    animation: bounce 2s ease-in-out infinite;
    letter-spacing: 2px;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s;
  }

  .btn-claim:active {
    transform: scale(0.92);
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  .sparkles {
    position: absolute;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .sparkle {
    position: absolute;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: sparkleFloat 3s ease-in-out infinite;
  }

  @keyframes sparkleFloat {
    0%   { transform: translateY(0) scale(0); opacity: 0; }
    30%  { opacity: 1; transform: scale(1); }
    100% { transform: translateY(-120px) scale(0); opacity: 0; }
  }

  /* ========== Page 2 ========== */
  #page2 {
    background: linear-gradient(180deg, #ffb6c1 0%, #ffc0cb 30%, #ffe4e1 100%);
    z-index: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #page2.active {
    z-index: 3;
    opacity: 1;
    transform: scale(1);
  }

  #page2:not(.active) {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.05);
  }

  .image-placeholder {
    width: clamp(240px, 60vw, 340px);
    height: clamp(240px, 60vw, 340px);
    border: 3px dashed rgba(255,20,147,0.4);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,20,147,0.5);
    font-size: 0.95rem;
    text-align: center;
    padding: 20px;
    margin: 30px 0 10px;
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
  }

  .page2-title {
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,20,147,0.5);
    margin-bottom: 10px;
    text-align: center;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }

  /* Floating hearts */
  .hearts-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .floating-heart {
    position: absolute;
    font-size: 1.5rem;
    animation: floatUp linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(110vh) rotate(0deg) scale(0.5);
      opacity: 0;
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.6;
    }
    100% {
      transform: translateY(-10vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  .btn-back {
    margin-top: 30px;
    padding: 14px 40px;
    font-size: 1rem;
    font-weight: 600;
    color: #ff69b4;
    background: rgba(255,255,255,0.85);
    border: 2px solid rgba(255,20,147,0.3);
    border-radius: 50px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
    position: relative;
    z-index: 2;
    transition: transform 0.2s;
  }

  .btn-back:active {
    transform: scale(0.92);
  }
</style>
</head>
<body>

<!-- ==================== Page 1 ==================== -->
<div id="page1" class="page">
  <div class="sparkles" id="sparkles"></div>
  <p class="blink-text">💗 点击领取你的<br>520专属男友 💗</p>
  <button class="btn-claim" onclick="goToPage2()">点 击 领 取</button>
</div>

<!-- ==================== Page 2 ==================== -->
<div id="page2" class="page">
  <div class="hearts-container" id="hearts"></div>
  <p class="page2-title">✨ 你的520专属男友 ✨</p>
  <img src="1.jpg" style="width: clamp(240px, 60vw, 340px); height: auto; border-radius: 20px; box-shadow: 0 10px 40px rgba(255,20,147,0.3);">
  <button class="btn-back" onclick="goToPage1()">← 返回</button>
</div>

<script>
// ========== Sparkles on Page 1 ==========
const sparklesEl = document.getElementById('sparkles');
for (let i = 0; i < 25; i++) {
  const sparkle = document.createElement('div');
  sparkle.classList.add('sparkle');
  sparkle.style.left = Math.random() * 100 + '%';
  sparkle.style.top  = Math.random() * 100 + '%';
  sparkle.style.animationDelay = Math.random() * 3 + 's';
  sparkle.style.animationDuration = (2 + Math.random() * 3) + 's';
  sparkle.style.width  = (4 + Math.random() * 8) + 'px';
  sparkle.style.height = sparkle.style.width;
  sparklesEl.appendChild(sparkle);
}

// ========== Floating hearts on Page 2 ==========
const heartsEl = document.getElementById('hearts');
const heartEmojis = ['💕', '💖', '💗', '💝', '💘', '🩷', '💓', '💞'];

function createHeart() {
  const heart = document.createElement('span');
  heart.classList.add('floating-heart');
  heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
  heart.style.left = Math.random() * 100 + '%';
  heart.style.fontSize = (1 + Math.random() * 2.5) + 'rem';
  heart.style.animationDuration = (4 + Math.random() * 8) + 's';
  heart.style.animationDelay = Math.random() * 2 + 's';
  heartsEl.appendChild(heart);

  heart.addEventListener('animationend', () => heart.remove());
}

// Create initial hearts
for (let i = 0; i < 12; i++) {
  createHeart();
}
// Keep creating new hearts
setInterval(createHeart, 800);

// ========== Page switching ==========
function goToPage2() {
  document.getElementById('page1').classList.add('hidden');
  document.getElementById('page2').classList.add('active');
}

function goToPage1() {
  document.getElementById('page1').classList.remove('hidden');
  document.getElementById('page2').classList.remove('active');
}
</script>
</body>
</html>
